<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Proxy Browser</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 10px;
    }
    #search-bar {
      width: 80%;
      max-width: 600px;
      display: flex;
      gap: 10px;
    }
    #url-input {
      flex: 1;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }
    #go-btn {
      padding: 8px 16px;
      border-radius: 5px;
      border: none;
      background-color: blueviolet;
      color: white;
      cursor: pointer;
    }
    #browser-frame {
      width: 90vw;
      height: 70vh;
      border: 1px solid #555;
    }
  </style>
</head>
<body>

  <h1>Mini Proxy Browser</h1>

  <div id="search-bar">
    <input type="text" id="url-input" placeholder="Enter URL (e.g. example.com)">
    <button id="go-btn">Go</button>
  </div>

  <iframe id="browser-frame" src=""></iframe>

  <script>
    const input = document.getElementById('url-input');
    const button = document.getElementById('go-btn');
    const iframe = document.getElementById('browser-frame');

    function loadURL() {
      let url = input.value.trim();
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;

      // Load through PHP proxy
      iframe.src = `https://mmsgames.vercel.app/proxy.php?url=${encodeURIComponent(url)}`;
    }

    button.addEventListener('click', loadURL);

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadURL();
    });
  </script>

</body>
</html>
