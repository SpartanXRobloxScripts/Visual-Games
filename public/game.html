<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentry X | Games</title>
  <link rel="icon" href="https://mmsgames.vercel.app/Logo125.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    iframe {
      border: none;
      position: fixed;
    }
    iframe.centered {
      width: 50vw;
      height: 50vw;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    iframe.fullscreen {
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      transform: none;
      z-index: 999;
    }
    .top-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1a1a1a;
      padding: 8px 30px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(40, 151, 255, 0.8), 0 0 8px rgba(22, 169, 255, 0.6);
      margin-top: 10px;
      animation: glowPulse 3s infinite ease-in-out;
      width: 100%;
      max-width: 800px;
      position: relative;
    }
    .top-panel img {
      height: 40px;
      width: 40px;
      object-fit: cover;
    }
    .top-panel h1 {
      color: white;
      font-size: 24px;
      margin: 0;
      font-family: monospace;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .special-button, .exitfullscreen {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      border-radius: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 145px;
      height: 35px;
      transition: all 0.3s ease;
      display: flex;
      text-align: center;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
    }
    .special-button {
      background-color: blueviolet;
      box-shadow: 0 0 10px rgba(151, 40, 255, 0.8), 0 0 8px rgba(219, 40, 255, 0.6);
    }
    .special-button:hover { scale: 0.95; }
    .special-button:active { scale: 0.9; }
    .exitfullscreen {
      background-color: rgb(43, 101, 226);
      box-shadow: 0 0 10px rgba(40, 108, 255, 0.8), 0 0 8px rgba(40, 54, 255, 0.6);
    }
    .exitfullscreen:hover { scale: 0.95; }
    .exitfullscreen:active { scale: 0.9; }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(40, 176, 255, 0.8), 0 0 8px rgba(151, 40, 255, 0.6); }
      50% { box-shadow: 0 0 12px rgb(40, 140, 255), 0 0 15px rgba(151, 40, 255, 0.9); }
    }
  </style>
</head>
<body>
  <div class="top-panel">
    <img src="https://mmsgames.vercel.app/Logo125.png" alt="Sentry X Logo" />
    <h1>Sentry X</h1>
    <div class="right-side">
      <img src="https://mmsgames.vercel.app/icons/Games.png" onclick="window.location.href='https://mmsgames.vercel.app/games.html'">
      <img src="https://mmsgames.vercel.app/icons/Discord.png" onclick="window.open('https://discord.gg/TKvhCRkajT', '_blank')">
      <img src="https://mmsgames.vercel.app/icons/TOS.png" onclick="window.location.href='https://docs.google.com/document/d/1oW54dmtFARwzJp9Uu3OymB3GWxLT7_kjolLLpT-CXEM/edit?tab=t.0'">
    </div>
  </div>
  <iframe id="gameFrame" src=""></iframe>
  <div id="fullscreen-button" class="special-button">Full Screen</div>
  <div id="exitfullscreen-button" class="exitfullscreen">Exit Full Screen</div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');
    if (url) {
      document.getElementById('gameFrame').src = url;
    } else {
      document.body.innerHTML = "<p>No game specified.</p>";
    }
    const iframe = document.getElementById('gameFrame');
    const fullscreenBtn = document.getElementById('fullscreen-button');
    const exitBtn = document.getElementById('exitfullscreen-button');
    exitBtn.style.display = "none";
    iframe.classList.add('centered');
    fullscreenBtn.addEventListener('click', () => {
      iframe.classList.remove('centered');
      iframe.classList.add('fullscreen');
      fullscreenBtn.style.display = 'none';
      exitBtn.style.display = 'flex';
    });
    exitBtn.addEventListener('click', () => {
      iframe.classList.remove('fullscreen');
      iframe.classList.add('centered');
      exitBtn.style.display = 'none';
      fullscreenBtn.style.display = 'flex';
    });
  </script>
</body>
</html>
