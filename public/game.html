<!DOCTYPE html>
<html>
<head>
  <title>Game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="gameFrame" src=""></iframe>

  <script>
    // Get the URL from query string
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');
    if (url) {
      document.getElementById('gameFrame').src = url;
    } else {
      document.body.innerHTML = "<p>No game specified.</p>";
    }
  </script>
</body>
</html>
