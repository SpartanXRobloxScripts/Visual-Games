  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      color: white;
    }

    .top-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #1d1d1d;
    width: 100vw; /* full viewport width */
    max-width: 100vw; /* remove previous max-width */
    padding: 0 20px; /* optional spacing from edges */
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000
}



.cards-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .card {
      position: relative;
      width: 350px;
      aspect-ratio: 1 / 1;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

.top-panel img {
    height: 60px;
    width: 60px;
    border-radius: 0%;
    object-fit: cover;
}


    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(40, 176, 255, 0.8), 0 0 8px rgba(151, 40, 255, 0.6); }
      50% { box-shadow: 0 0 12px rgb(40, 140, 255), 0 0 15px rgba(151, 40, 255, 0.9); }
    }

color: whitesmoke;      padding: 10px;

.game-section {
    background-color: #1a1a1a;
    margin: 30px auto;
    border-radius: 15px;

}

.game-section h2 {

    text-align: left;
    margin-bottom: 15px;
}

.cards-wrapper {
    display: flex;
    flex-wrap: wrap;        /* allow wrapping */

    gap: 20px;
}
.card {
    background-color: #222;
    color: white;
    width: 150px;   /* slightly bigger */
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    cursor: pointer;

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;

    }

    .title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover .title {
      opacity: 1;
    }

    .circle {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.1;
  animation-name: moveDiagonal;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.sections-row {
    display: flex;
    justify-content: center; /* center the row */
    gap: 30px;               /* space between sections */
    flex-wrap: wrap;         /* wrap to next row if screen is too small */
}

.game-sectiontitle {

    justify-content: left;

.background-circles {

  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

@keyframes moveDiagonal {
  0% { transform: translate(0, 0); opacity: 0.1; }
  100% { transform: translate(100vw, 100vh); opacity: 0; }
}

}

.custom-button:hover {

<script>
  const container = document.querySelector('.background-circles');

  for (let i = 0; i < 125; i++) {
    const circle = document.createElement('div');
    circle.className = 'circle';

    // Random starting position (within the viewport)
    const top = Math.random() * 100;
    const left = Math.random() * 100;

    // Random size between 10px–25px
    const size = 10 + Math.random() * 15;

    // Random animation delay & duration
    const delay = -Math.random() * 20; // negative to stagger the start
    const duration = 10 + Math.random() * 10;

    // Apply inline style
    circle.style.top = `${top}%`;
    circle.style.left = `${left}%`;
    circle.style.width = `${size}px`;
    circle.style.height = `${size}px`;
    circle.style.animationDelay = `${delay}s`;
    circle.style.animationDuration = `${duration}s`;

    container.appendChild(circle);
  }
</script>
