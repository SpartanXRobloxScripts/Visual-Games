<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
  <title>Discord Embed</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AndreajnRcm4/b398dl2h74v@9a23fbb2373d743a564873251cbb57736ebc1f73/style.css" type="text/css" />
  <style>
    /* small helper so iframe fills page */
    html,body { height:100%; margin:0; }
    .discord-frame { width:100%; height:100vh; border:0; }
  </style>
</head>
<body>
  <!-- Replace YOUR_SERVER_ID with the numeric ID of your server -->
  <iframe class="discord-frame"
    src="https://discord.com/widget?id=YOUR_SERVER_ID&theme=dark"
    allowtransparency="true"
    sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
  </iframe>
</body>
</html>
